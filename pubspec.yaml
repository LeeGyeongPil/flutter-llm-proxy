name: flutter_llm_proxy
description: >-
  Keep OpenAI, Anthropic and Gemini keys off Flutter apps: a Dart shelf proxy
  with Firebase App Check checks, rate limits and unbuffered SSE streaming.
version: 0.1.0
repository: https://github.com/LeeGyeongPil/flutter-llm-proxy
issue_tracker: https://github.com/LeeGyeongPil/flutter-llm-proxy/issues
topics:
  - llm
  - proxy
  - shelf
  - firebase
  - openai

environment:
  sdk: ^3.5.0

executables:
  flutter_llm_proxy: flutter_llm_proxy

dependencies:
  args: ^2.7.0
  dart_jsonwebtoken: ^3.4.1
  http: ^1.6.0
  pointycastle: ^4.0.0
  shelf: ^1.4.2
  yaml: ^3.1.3

dev_dependencies:
  test: 1.25.15
